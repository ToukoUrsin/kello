<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Kello: lung cancer patients treated to cure, by county</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23104281' stroke-width='3'/%3E%3Cpath d='M16 8v8l6 4' fill='none' stroke='%23104281' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // A stylesheet or script that fails to load on a flaky network leaves a broken page: load the page again, at most three times.
      addEventListener("error", function (e) {
        var t = e.target;
        if (!t || (t.tagName !== "LINK" && t.tagName !== "SCRIPT")) return;
        try { var n = Number(sessionStorage.getItem("kello-again") || 0); if (n >= 3) return; sessionStorage.setItem("kello-again", String(n + 1)); } catch (x) { return; }
        setTimeout(function () { location.reload(); }, 700);
      }, true);
      addEventListener("load", function () { setTimeout(function () { try { sessionStorage.removeItem("kello-again"); } catch (x) {} }, 5000); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
